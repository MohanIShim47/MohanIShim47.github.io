<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="https://statics.teams.cdn.live.net/evergreen-assets/icons/Teams_Logo_v2025_80x80.png">
    <title id="tab-name">(1) Assignments | Assignments | Microsoft Teams</title>
    <link rel="stylesheet" href="assets/css/g.css">
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
    </div>
    <aside class="sidebar">
      <div class="logo">
        <img src="assets/img/logo.png" alt="Logo">
      </div>
      <a href="/"><i data-lucide="home"></i></a>
      <a href="/g.html" class="active"><i data-lucide="gamepad-2"></i></a>
    </aside>
    <div class="content">
      <header>
        <input id="search" placeholder="Search games…" />
      </header>

      <div class="grid" id="games">Loading...</div>
    </div>
    <div id="gameContainer">
      <div id="gameHeader">
        <button class="nav-btn" onclick="closeGame()">
          <i data-lucide="x"></i>
        </button>
        <button class="nav-btn" onclick="toggleFullscreen()">
          <i data-lucide="expand"></i>
        </button>
      </div>
      <div id="gameContent"></div>
    </div>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/index.js"></script>
    <script src="assets/js/g.js"></script>
  </body>
</html>
